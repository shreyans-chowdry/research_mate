services:
  postgres:
    image: postgres:16-alpine
    container_name: researchmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: researchmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchmate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchmate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/researchmate
      - PORT=8000
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
