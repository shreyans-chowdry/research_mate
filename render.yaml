databases:
  - name: researchmate-db
    databaseName: researchmate
    plan: free
    ipAllowList: []

services:
  - type: web
    name: researchmate-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: researchmate-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
